 ============================================================================
; Konggu 运行时参数模板 (示例)
; ----------------------------------------------------------------------------
; ⚠️  重要说明：
;   当前版本的程序【并不读取】本文件 —— 所有参数仍写死在源码中。
;   本 ini 仅作为"可调参数清单"供维护者参考；迁移到配置驱动时应逐项替换
;   源码中的硬编码常量，再让程序在启动时读取本文件。
;
;   修改方法（现状）：
;     - 客户端 (C++)：修改 client/main.cpp 后重新编译；
;     - 服务端 (Python)：修改 server/konggu_server.py / KongguProcessFiles.py 后重启。
;
;   每项注释标注了：对应的源码位置 / 当前默认值。
; ============================================================================

; ---------------------------------------------------------------------------
; [client] —— 采集/上传客户端（C++，main.cpp）
; ---------------------------------------------------------------------------
[client]
; 服务端基础地址。源码：main.cpp 顶部 `const string &url`
;   默认 http://192.168.26.215:8088  （备份版 main-backup.cpp 为 192.168.43.131:8088）
;   /upload、/clean 路由由该地址拼接得到
server_url =

; 热成像图宽/高（像素）。源码：#define IMAGE_W / IMAGE_H
;   默认 640 x 512（需与机芯 Y8 输出一致）
image_width =
image_height =

; 可见光摄像头编号。源码：全局 `cv::VideoCapture cap(0)`
;   0 对应 Linux 的 /dev/video0
camera_index =

; 每 N 帧保存/上传一对图片。源码：主循环 `count % 10 == 0`
save_interval =

; 开始上传（并抓拍可见光）之前的预热帧数。源码：`if (count > 30)`
upload_start_after_frame =

; 调色板类型。源码：UT_PALETTE_IRON（可选 WHITEHOT/REDHOT/LAVA/RAINBOW 等，
; 见 include/UTDF.h 的 UT_PALETTE_TYPE）
palette =

; 本地图片缓存目录（相对 build 运行目录）。源码：多处 "../data"
local_data_dir =

; 机芯设备类型。源码：UT_Init(&pInstance, UT_JX007)
; 可选 UT_JX002/UT_JX003/UT_JX004/UT_JX007（见 UTDF.h）
device_type =

; ---------------------------------------------------------------------------
; [server] —— 推理/展示服务端（Python）
; ---------------------------------------------------------------------------
[server]
; 监听地址/端口。源码：konggu_server.py `app.run(host='0.0.0.0', port=8088)`
;   需与 [client].server_url 指向一致
host =
port =

; 上传接收目录。源码：konggu_server.py 模块级 upload_dir = 'uploads_konggu'
upload_dir =

; 推理结果输出目录。源码：out_dir = 'out_konggu'
out_dir =

; 模型文件目录（相对运行目录）。源码：konggu_models/cold-best.pt、hot-best.pt
;   启动时终端交互键入 1=低温(cold) 2=高温(hot)，当前无法从外部参数指定
model_cold_path =
model_hot_path =

; 目录轮询间隔（秒）。源码：KongguProcessFiles.py monitor_directory() 中 sleep(1)
poll_interval_sec =

; ---------------------------------------------------------------------------
; [align] —— 红外/可见光对齐参数（服务端，pairAlign.py）
; 说明：这些参数依赖两台成像器相对采集目标的固定安装位姿，换装/重装后需重新标定。
; 源码调用处：KongguProcessFiles.py process_file_pair()
;   pair_align_func_konggu(temp_path, camera_path, rescale_factor=1.5,
;                          trans_x=100, trans_y=-10)
; ---------------------------------------------------------------------------
[align]
; 可见光图像放大倍数（让可见光画面放大以覆盖热图范围）
rescale_factor =

; 平移偏移量（像素）
trans_x =
trans_y =

; 融合时热图/可见光的权重（源码 addWeighted(..., 0.5, 0.5, 0)）
blend_weight_infrared =
blend_weight_visible =

; 推理结果保存宽度（源码 new_width = 640，高度按比例自动）
output_width =

; ---------------------------------------------------------------------------
; [merge] —— 全景拼接参数（MergeImage.py，目前未接入主流程）
; ---------------------------------------------------------------------------
[merge]
; 相邻图像重叠像素数（默认 50）
overlap_length =

; ---------------------------------------------------------------------------
; 参考：客户端 C++ 中其它与算法/稳定性相关的硬编码
;   - 循环队列容量 MAX_LISTS = 25（main.cpp 中该队列结构已保留但未启用）
;   - 温度数组仅打印中心像素温度，未上传/未参与决策
; ---------------------------------------------------------------------------
